<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Editor Markdown</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="css/prism.css">
  <script src="js/marked.umd.js"></script>
  <script src="js/prism.js"></script>
  <script src="js/custom_tags.js"></script>
  <script src="js/editor_n_buttons.js" defer></script>
</head>
<body>
  
<h1>Markdown Editor</h1>

<div class="view-toggle-bar">
    <button type="button" id="btn-view-split" class="active">💻 Split View</button>
    <button type="button" id="btn-view-input">✍️ Solo Editor</button>
    <button type="button" id="btn-view-preview">👁️ Solo Anteprima</button>
</div>

<div class=push>
  <button type="button" id="btn-h1" title="Paragrafo">Par 1</button>
  <button type="button" id="btn-h2" title="Sotto paragrafo">Par 2</button>
  <button type="button" id="btn-h3" title="Sotto sotto paragrafo">Par 3</button>
  <button type="button" id="btn-note" title="Nota">📝</button>
  <button type="button" id="btn-tip" title="Suggerimento">💡</button>
  <button type="button" id="btn-warning" title="Avviso">⚠️</button>
  <button type="button" id="btn-menu-1" title="Indice fino 1' livello">Ind 1</button>
  <button type="button" id="btn-menu-2" title="Indice fino 2' livello">Ind 2</button>
  <button type="button" id="btn-menu-3" title="Indice fino 3' livello">Ind 3</button>
  <button type="button" id="btn-ubu-version" title="Versioni di Ubuntu">Ubu versioni</button>
  <button type="button" id="btn-link-forum" title="Link al forum">Forum</button>
  <br>
  <button type="button" id="btn-bold" title="Grassetto Ctrl+b"><b>B</b></button>
  <button type="button" id="btn-italic" title="Corsivo Ctrl+i"><b><i>i</i></b></button>
  <button type="button" id="btn-tt" title="Largezza fissa Ctrl+`"><tt>tt</tt></button>
  <button type="button" id="btn-codeblock" title="Blocco codice"><b><</b><b>></b></button>
  <button type="button" id="btn-link" title="Link">🔗</button>
  <button type="button" id="btn-br" title="A capo"><b>br</b></button>
  <button type="button" id="btn-bullet" title="Elenco puntato">:=</button>
  <button type="button" id="btn-num" title="Elenco numerato">:1</button>
  <button type="button" id="btn-comment" title="Commento"><--</button>
  <button type="button" id="btn-quote" title="Quote"><b>"</b> <b>"</b></button>
  <button type="button" id="btn-anchor" title="Anchor">⚓</button>
  <button type="button" id="btn-table" title="Tabella">🪟</button>
  <button type="button" id="btn-img" title="Immagine">🖼️</button>
</div>

<div id="editor-wrapper" class="editor-container split-view">
  <textarea id="markdown-input" placeholder="Scrivi qui in Markdown..."></textarea>
  <div id="preview"></div>
</div>

</body>
</html>
